<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Cotrader</title>
    <style>
        :root {
            --deep-navy: #0a192f;
            --navy: #071226;
            --panel: #112240;
            --cyan: #3bafda;
            --green: #3ddc97;
            --white: #e6f1ff;
            --slate: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--deep-navy);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 500px;
            background: var(--panel);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid var(--cyan);
        }

        h1 {
            color: var(--green);
            margin-bottom: 1rem;
        }

        p {
            color: var(--slate);
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            background: var(--cyan);
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }

        .btn:hover {
            background: var(--green);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment Page</h1>
        <p>This is where users would complete payment for their selected plan.</p>
        <p>Selected Plan: <strong id="planName"></strong> - $<span id="planPrice"></span>/month</p>
        
        <div style="margin-top: 2rem;">
            <a href="index.html?action=logout" class="btn">Back to Plans</a>
            <button class="btn" onclick="alert('Payment processed successfully!')">Complete Payment</button>
        </div>
    </div>

    <script>
        // Display selected plan info
        const selectedPlan = localStorage.getItem('selectedPlan') || 'basic';
        const selectedPrice = localStorage.getItem('selectedPrice') || '29';
        
        const planNames = {
            'basic': 'Basic',
            'pro': 'Pro', 
            'premium': 'Premium'
        };
        
        document.getElementById('planName').textContent = planNames[selectedPlan];
        document.getElementById('planPrice').textContent = selectedPrice;
    </script>
</body>
</html>
