<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cotrader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --deep-navy: #0a192f;
            --navy: #071226;
            --panel: #112240;
            --cyan: #3bafda;
            --green: #3ddc97;
            --white: #e6f1ff;
            --slate: #8892b0;
            --loss-red: #e96d76;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--deep-navy);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 175, 218, 0.2);
        }

        .auth-hero {
            flex: 1;
            background: linear-gradient(135deg, var(--navy), var(--deep-navy));
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            color: var(--green);
        }

        .hero-content h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--cyan), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            color: var(--slate);
            margin-bottom: 2rem;
        }

        .selected-plan {
            background: rgba(59, 175, 218, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--green);
            margin-top: 2rem;
            width: 100%;
        }

        .selected-plan h3 {
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .selected-plan p {
            color: var(--slate);
            margin: 0;
        }

        .auth-form {
            flex: 1;
            padding: 3rem;
            background: var(--panel);
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .form-header p {
            color: var(--slate);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--white);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: var(--navy);
            border: 1px solid rgba(59, 175, 218, 0.3);
            border-radius: 6px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(59, 175, 218, 0.1);
        }

        .password-strength {
            height: 4px;
            background: var(--navy);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--slate);
        }

        .form-footer a {
            color: var(--cyan);
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--cyan), var(--green));
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 175, 218, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
            }
            
            .auth-hero {
                padding: 2rem;
            }
            
            .auth-form {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-hero">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                COTRADER
            </div>
            <div class="hero-content">
                <h1>Start Your Trading Journey</h1>
                <p>Join thousands of successful traders who use Cotrader to build discipline and maximize profits</p>
                
                <div class="selected-plan" id="selectedPlanInfo">
                    <!-- Selected plan info will be populated by JavaScript -->
                </div>
            </div>
        </div>
        
        <div class="auth-form">
            <div class="form-header">
                <h2>Create Account</h2>
                <p>Sign up to access your selected plan</p>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="password" placeholder="Create a strong password" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="passwordStrength"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-input" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn">Create Account & Continue</button>
                
                <div class="form-footer">
                    <div>
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms</a></label>
                    </div>
                    <a href="login.html">Already have an account?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signupForm');
            const selectedPlanInfo = document.getElementById('selectedPlanInfo');
            const passwordInput = document.getElementById('password');
            const passwordStrength = document.getElementById('passwordStrength');
            
            // Get selected plan from localStorage
            const selectedPlan = localStorage.getItem('selectedPlan') || 'basic';
            const selectedPrice = localStorage.getItem('selectedPrice') || '29';
            
            const planNames = {
                'basic': 'Basic Plan',
                'pro': 'Pro Plan', 
                'premium': 'Premium Plan'
            };
            
            // Display selected plan info
            selectedPlanInfo.innerHTML = `
                <h3>Selected Plan: ${planNames[selectedPlan]}</h3>
                <p>$${selectedPrice}/month - Start your journey today</p>
            `;
            
            // Password strength indicator
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                if (password.length >= 8) strength += 25;
                if (/[A-Z]/.test(password)) strength += 25;
                if (/[0-9]/.test(password)) strength += 25;
                if (/[^A-Za-z0-9]/.test(password)) strength += 25;
                
                passwordStrength.style.width = strength + '%';
                passwordStrength.style.background = strength < 50 ? 'var(--loss-red)' : 
                                                   strength < 75 ? 'var(--cyan)' : 'var(--green)';
            });
            
            // Form submission
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Store user info and mark as registered
                localStorage.setItem('hasAccount', 'true');
                localStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to payment page
                window.location.href = 'payment.html';
            });
        });
    </script>
</body>
</html>
