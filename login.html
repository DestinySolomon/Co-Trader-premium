<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cotrader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --deep-navy: #0a192f;
            --navy: #071226;
            --panel: #112240;
            --cyan: #3bafda;
            --green: #3ddc97;
            --white: #e6f1ff;
            --slate: #8892b0;
            --loss-red: #e96d76;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--deep-navy);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 175, 218, 0.2);
        }

        .auth-hero {
            flex: 1;
            background: linear-gradient(135deg, var(--navy), var(--deep-navy));
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            color: var(--green);
        }

        .hero-content h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--cyan), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            color: var(--slate);
            margin-bottom: 2rem;
        }

        .auth-form {
            flex: 1;
            padding: 3rem;
            background: var(--panel);
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .form-header p {
            color: var(--slate);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--white);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: var(--navy);
            border: 1px solid rgba(59, 175, 218, 0.3);
            border-radius: 6px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(59, 175, 218, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--slate);
        }

        .forgot-password {
            color: var(--cyan);
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--cyan), var(--green));
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 175, 218, 0.3);
        }

        .signup-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--slate);
        }

        .signup-link a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
            }
            
            .auth-hero {
                padding: 2rem;
            }
            
            .auth-form {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-hero">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                COTRADER
            </div>
            <div class="hero-content">
                <h1>Welcome Back</h1>
                <p>Continue your trading journey with Cotrader's powerful tools and analytics</p>
                <p style="color: var(--green); font-weight: 500; margin-top: 1rem;">
                    <i class="fas fa-rocket"></i> Access your trading dashboard
                </p>
            </div>
        </div>
        
        <div class="auth-form">
            <div class="form-header">
                <h2>Login to Your Account</h2>
                <p>Enter your credentials to continue</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn">Login to Dashboard</button>
                
                <div class="signup-link">
                    Don't have an account? <a href="signup.html">Sign up here</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            // Clear any selected plan from storage for generic logins
            localStorage.removeItem('selectedPlan');
            localStorage.removeItem('selectedPrice');
            
            // Form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Mark user as logged in
                localStorage.setItem('isLoggedIn', 'true');
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            });
        });
    </script>
</body>
</html>
